name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

defaults:
  run:
    shell: bash

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux x86_64 + GCC ──
          - os: ubuntu-latest
            name: linux-x64-gcc
            cc: gcc
            cxx: g++
            cmake_args: >-
              -DCMAKE_BUILD_TYPE=Debug
              -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic -Werror"

          - os: ubuntu-latest
            name: linux-x64-gcc-asan
            cc: gcc
            cxx: g++
            cmake_args: >-
              -DCMAKE_BUILD_TYPE=Debug
              -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
              -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

          # ── Linux ARM64 + GCC ──
          - os: ubuntu-24.04-arm
            name: linux-arm64-gcc
            cc: gcc
            cxx: g++
            cmake_args: >-
              -DCMAKE_BUILD_TYPE=Debug
              -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic -Werror"

          # ── Windows x86_64 + MSVC ──
          - os: windows-latest
            name: win-x64-msvc
            cc: cl
            cxx: cl
            cmake_args: >-
              -DCMAKE_BUILD_TYPE=Debug
              -DCMAKE_CXX_FLAGS="-W4 -WX -EHsc"

          # ── Windows ARM64 + MSVC (native) ──
          - os: windows-11-arm
            name: win-arm64-msvc
            cc: cl
            cxx: cl
            cmake_args: >-
              -DCMAKE_BUILD_TYPE=Debug
              -DCMAKE_CXX_FLAGS="-W4 -WX -EHsc"

          # ── macOS ARM64 + AppleClang ──
          - os: macos-latest
            name: macos-arm64-clang
            cc: clang
            cxx: clang++
            cmake_args: >-
              -DCMAKE_BUILD_TYPE=Debug
              -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic -Werror"

          - os: macos-latest
            name: macos-arm64-tsan
            cc: clang
            cxx: clang++
            cmake_args: >-
              -DCMAKE_BUILD_TYPE=Debug
              -DCMAKE_CXX_FLAGS="-fsanitize=thread"
              -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"

          - os: macos-latest
            name: macos-arm64-release
            cc: clang
            cxx: clang++
            cmake_args: >-
              -DCMAKE_BUILD_TYPE=Release
              -DCMAKE_CXX_FLAGS="-O2 -Wall -Wextra -Werror"

          # ── macOS x86_64 + AppleClang (Intel) ──
          - os: macos-26-intel
            name: macos-x64-clang
            cc: clang
            cxx: clang++
            cmake_args: >-
              -DCMAKE_BUILD_TYPE=Debug
              -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic -Werror"

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v7

      - name: Configure CMake
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build -S . \
            ${{ matrix.cmake_args }} \
            -DCAMPELLO_CORE_BUILD_TESTS=ON \
            -DCAMPELLO_CORE_BUILD_EXAMPLES=ON \
            -DCAMPELLO_CORE_BUILD_BENCHMARKS=OFF

      - name: Build
        run: cmake --build build --config Debug --parallel

      - name: Test
        working-directory: build
        run: ctest --output-on-failure --build-config Debug -j1

  android:
    strategy:
      fail-fast: false
      matrix:
        abi:
          - arm64-v8a
          - armeabi-v7a
          - x86_64
          - x86
    name: android-ndk-${{ matrix.abi }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Android NDK
        uses: android-actions/setup-android@v4

      - name: Install NDK
        run: sdkmanager "ndk;27.2.12479018"

      - name: Configure CMake (Android ${{ matrix.abi }})
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_SYSTEM_VERSION=24 \
            -DCMAKE_ANDROID_ARCH_ABI=${{ matrix.abi }} \
            -DCMAKE_ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/27.2.12479018 \
            -DCMAKE_ANDROID_STL_TYPE=c++_shared \
            -DCAMPELLO_CORE_BUILD_TESTS=OFF \
            -DCAMPELLO_CORE_BUILD_EXAMPLES=OFF \
            -DCAMPELLO_CORE_BUILD_BENCHMARKS=OFF

      - name: Build smoke test
        run: cmake --build build --target smoke_test --parallel

  wasm:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: wasm
            pthread: OFF
            run_smoke: true
          - name: wasm-pthreads
            pthread: ON
            run_smoke: false
    name: ${{ matrix.config.name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: 3.1.74
          actions-cache-folder: 'emsdk-cache'

      - name: Verify Emscripten
        run: emcc --version

      - name: Configure CMake (WASM)
        run: |
          if [ "${{ matrix.config.pthread }}" = "ON" ]; then
            PTHREAD_CXX="-pthread"
            PTHREAD_LD="-pthread"
          else
            PTHREAD_CXX=""
            PTHREAD_LD=""
          fi

          emcmake cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="${PTHREAD_CXX}" \
            -DCMAKE_EXE_LINKER_FLAGS="${PTHREAD_LD}" \
            -DCAMPELLO_CORE_BUILD_TESTS=OFF \
            -DCAMPELLO_CORE_BUILD_EXAMPLES=ON \
            -DCAMPELLO_CORE_BUILD_BENCHMARKS=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Build smoke test
        run: cmake --build build --target smoke_test --parallel

      - name: Run smoke test (Node.js)
        if: matrix.config.run_smoke
        run: node build/smoke_test.js

  ios:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: ios-device
            archs: arm64
          - name: ios-simulator
            archs: x86_64;arm64
    name: ${{ matrix.platform.name }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Configure CMake (iOS)
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.platform.archs }}" \
            -DCAMPELLO_CORE_BUILD_TESTS=OFF \
            -DCAMPELLO_CORE_BUILD_EXAMPLES=OFF \
            -DCAMPELLO_CORE_BUILD_BENCHMARKS=OFF

      - name: Build smoke test
        run: cmake --build build --target smoke_test --parallel

      # Baseline environment info, captured on every run (not just failures)
      # so a future flaky/persistent simctl failure can be compared against
      # a known-good run instead of guessing what's different about this
      # runner vs. a local machine.
      - name: Simulator environment info
        if: matrix.platform.name == 'ios-simulator'
        run: |
          echo "--- sw_vers ---"
          sw_vers
          echo "--- uname -a ---"
          uname -a
          echo "--- xcodebuild -version ---"
          xcodebuild -version
          echo "--- CPU / memory ---"
          echo "hw.ncpu: $(sysctl -n hw.ncpu)"
          echo "hw.memsize: $(sysctl -n hw.memsize)"
          echo "--- simctl runtimes ---"
          xcrun simctl list runtimes
          echo "--- simctl devices (available) ---"
          xcrun simctl list devices available

      # Simulator binaries run natively on the macOS host (no CPU emulation),
      # so unlike ios-device (real ARM64 hardware, no runner available for
      # that), we can actually execute this one via simctl instead of just
      # compiling it.
      - name: Boot iOS Simulator
        if: matrix.platform.name == 'ios-simulator'
        timeout-minutes: 10
        run: |
          DEVICE_UDID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | test("iPhone"))][0].udid')
          echo "Booting simulator device $DEVICE_UDID"
          echo "DEVICE_UDID=$DEVICE_UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_UDID"
          xcrun simctl bootstatus "$DEVICE_UDID" -b

      - name: Run smoke test (iOS Simulator)
        if: matrix.platform.name == 'ios-simulator'
        timeout-minutes: 5
        run: |
          BIN="${{ github.workspace }}/build/smoke_test.app/smoke_test"
          # simctl spawn occasionally fails with an opaque CoreSimulator/XPC
          # error (e.g. LaunchdSimError code=153 "Completely unexpected
          # error") that isn't reproducible locally and isn't specific to
          # this binary -- known CoreSimulator flakiness in CI. Retry a
          # few times before giving up.
          attempt=1
          max_attempts=3
          until xcrun simctl spawn "$DEVICE_UDID" "$BIN"; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "simctl spawn failed after $max_attempts attempts"
              exit 1
            fi
            echo "simctl spawn failed (attempt $attempt/$max_attempts), retrying..."
            attempt=$((attempt + 1))
            sleep 5
          done

      - name: Dump CoreSimulator diagnostics on failure
        if: failure() && matrix.platform.name == 'ios-simulator'
        run: |
          echo "--- simctl devices (all, including shutdown/unavailable) ---"
          xcrun simctl list devices || true
          echo "--- CoreSimulator.log (tail) ---"
          LOG="$HOME/Library/Logs/CoreSimulator/CoreSimulator.log"
          if [ -f "$LOG" ]; then
            tail -n 300 "$LOG"
          else
            echo "(no CoreSimulator.log found at $LOG)"
          fi
          echo "--- recent CoreSimulator / launchd_sim system log ---"
          /usr/bin/log show --predicate 'subsystem == "com.apple.CoreSimulator" OR process == "launchd_sim"' --last 10m --style compact 2>&1 | tail -n 300 || true
          echo "--- recent crash reports mentioning smoke_test or launchd_sim ---"
          find "$HOME/Library/Logs/DiagnosticReports" -type f \( -iname "*smoke_test*" -o -iname "*launchd_sim*" \) -newermt "-15 minutes" -exec echo "=== {} ===" \; -exec cat {} \; 2>/dev/null || true
